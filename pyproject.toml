[project]
name = "mizan"
version = "1.0.0"
description = "MIZAN - Jordan Forecasting & Statistical Intelligence Lab (independent research demo)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "mizan/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]
